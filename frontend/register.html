<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account - DevBareun Workspace</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.png?v=2" />
  <script>
    const query = new URLSearchParams(location.search);
    const target = new URL('/workspace/', location.origin);
    target.searchParams.set('view', 'register');
    if (query.get('next')) target.searchParams.set('next', query.get('next'));
    location.replace(target.pathname + target.search);
  </script>
</head>
<body><p>Opening DevBareun account setup...</p></body>
</html>
