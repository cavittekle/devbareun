<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Failed - DevBareun</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.png?v=2" />
  <script>
    const target = new URL('/workspace/', location.origin);
    target.searchParams.set('view', 'payment-failed');
    new URLSearchParams(location.search).forEach((value, key) => target.searchParams.set(key, value));
    location.replace(target.pathname + target.search);
  </script>
</head>
<body><p>Opening DevBareun payment status...</p></body>
</html>
