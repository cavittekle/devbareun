
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projects — DevBareun</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/saas-auth.css?v=13936" />
  <link rel="stylesheet" href="css/persistent-workspace.css?v=13936" />
</head>
<body data-protected="true" class="workspace-page">
  <main class="workspace-layout">
    <aside class="workspace-sidebar">
      <a class="brand-link" href="/">DevBareun</a>
      <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a class="active" href="/projects.html">Projects</a>
        <a href="/reports.html">Reports</a>
        <a href="/billing.html">Billing</a>
      </nav>
    </aside>
    <section class="workspace-main">
      <header class="workspace-topbar">
        <div><p class="eyebrow">Projects</p><h1>Create and manage projects</h1></div>
      </header>
      <section class="workspace-panel wide">
        <h2>New project</h2>
        <form id="workspaceProjectForm" class="auth-form">
          <label>Project name <input name="project_name" placeholder="Shusha Central Street project" required /></label>
          <label>Location <input name="location" placeholder="Shusha, Azerbaijan" /></label>
          <label>Contractor <input name="contractor" placeholder="Contractor company" /></label>
          <label>Client <input name="client" placeholder="Client / owner" /></label>
          <label>Contract value <input name="contract_value" type="number" step="0.01" placeholder="3139625.02" /></label>
          <label>Currency <input name="currency" value="AZN" /></label>
          <button class="btn btn-primary" type="submit">Save project</button>
          <p id="workspaceProjectStatus" class="auth-status"></p>
        </form>
      </section>
      <section class="workspace-panel wide">
        <h2>Saved projects</h2>
        <div id="workspaceProjectsList"></div>
      </section>
    </section>
  </main>
  <script src="js/auth-workspace.js?v=13936"></script>
  <script src="js/persistent-workspace.js?v=13936"></script>
</body>
</html>
